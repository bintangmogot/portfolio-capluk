name: Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main # Ini akan berjalan otomatis setiap kamu push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Static Export
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to Hostinger via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "set ssl:verify-certificate no; set ftp:ssl-allow true; set ftp:list-options -a; open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER; mirror -R -v -c --delete --parallel=2 ./out/ /public_html/"
